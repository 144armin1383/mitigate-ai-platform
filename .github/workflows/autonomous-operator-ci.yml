name: Autonomous Operator Runtime CI

on:
  push:
    branches: [main]
    paths:
      - 'agent/execution/**'
      - 'agent/runtime/**'
      - 'agent/bootstrap/**'
      - 'agent/maintenance/activate_isolated_mission_runtime.sh'
      - 'agent/maintenance/activate_openclaw_worker_compat.sh'
      - 'agent/tests/test_isolated_mission_runtime.py'
      - 'agent/tests/test_autonomous_operator_runtime.py'
      - 'agent/tests/test_host_recovery_supervisor.py'
      - 'agent/tests/test_mission_diagnostics_git_warnings.py'
      - 'agent/tests/test_runtime_execution_observability.py'
      - 'agent/tests/test_runtime_router_failover.py'
      - 'agent/tests/test_runtime_consolidation_controller.py'
      - 'agent/tests/test_openclaw_worker_compat.py'
      - 'agent/tests/test_openhands_managed_home.py'
      - 'agent/tests/test_openhands_timeout_cleanup.py'
      - 'agent/tests/test_read_only_mission_completion.py'
      - 'agent/tests/test_mcp_read_only_classifier.py'
      - 'agent/tests/test_manual_review_status.py'
      - '.github/workflows/autonomous-operator-ci.yml'
  pull_request:
    paths:
      - 'agent/execution/**'
      - 'agent/runtime/**'
      - 'agent/bootstrap/**'
      - 'agent/maintenance/activate_isolated_mission_runtime.sh'
      - 'agent/maintenance/activate_openclaw_worker_compat.sh'
      - 'agent/tests/test_isolated_mission_runtime.py'
      - 'agent/tests/test_autonomous_operator_runtime.py'
      - 'agent/tests/test_host_recovery_supervisor.py'
      - 'agent/tests/test_mission_diagnostics_git_warnings.py'
      - 'agent/tests/test_runtime_execution_observability.py'
      - 'agent/tests/test_runtime_router_failover.py'
      - 'agent/tests/test_runtime_consolidation_controller.py'
      - 'agent/tests/test_openclaw_worker_compat.py'
      - 'agent/tests/test_openhands_managed_home.py'
      - 'agent/tests/test_openhands_timeout_cleanup.py'
      - 'agent/tests/test_read_only_mission_completion.py'
      - 'agent/tests/test_mcp_read_only_classifier.py'
      - 'agent/tests/test_manual_review_status.py'
      - '.github/workflows/autonomous-operator-ci.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mcp>=2,<3'
      - name: Compile autonomous runtime
        run: |
          python -m py_compile \
            agent/execution/external_openhands_runner.py \
            agent/execution/managed_openhands_adapter.py \
            agent/execution/openclaw_adapter.py \
            agent/execution/runtime_router.py \
            agent/runtime/autonomous_mission_queue.py \
            agent/runtime/autonomous_mission_diagnostics.py \
            agent/runtime/host_recovery_supervisor.py \
            agent/runtime/manual_review_status.py \
            agent/runtime/mission_diagnostics.py \
            agent/runtime/task_scope_workspace_controller.py \
            agent/runtime/managed_workspace_mission_controller.py \
            agent/runtime/workspace_production_mission_controller.py \
            agent/runtime/production_runtime_api_isolated.py \
            agent/runtime/runtime_consolidation_controller.py \
            agent/runtime/runtime_mcp_server.py \
            agent/runtime/runtime_mcp_server_extended.py \
            agent/tests/test_isolated_mission_runtime.py \
            agent/tests/test_autonomous_operator_runtime.py \
            agent/tests/test_host_recovery_supervisor.py \
            agent/tests/test_mission_diagnostics_git_warnings.py \
            agent/tests/test_runtime_execution_observability.py \
            agent/tests/test_runtime_router_failover.py \
            agent/tests/test_runtime_consolidation_controller.py \
            agent/tests/test_openclaw_worker_compat.py \
            agent/tests/test_openhands_managed_home.py \
            agent/tests/test_openhands_timeout_cleanup.py \
            agent/tests/test_read_only_mission_completion.py \
            agent/tests/test_mcp_read_only_classifier.py \
            agent/tests/test_manual_review_status.py
      - name: Check shell integration
        run: |
          bash -n agent/bootstrap/configure_openhands_mcp.sh
          bash -n agent/bootstrap/enable_runtime_consolidation.sh
          bash -n agent/bootstrap/disable_runtime_consolidation.sh
          bash -n agent/maintenance/activate_isolated_mission_runtime.sh
          bash -n agent/maintenance/activate_openclaw_worker_compat.sh
          bash -n agent/execution/openclaw_compat_wrapper.sh
      - name: Run regression tests
        run: |
          python -m unittest \
            agent.tests.test_isolated_mission_runtime \
            agent.tests.test_autonomous_operator_runtime \
            agent.tests.test_host_recovery_supervisor \
            agent.tests.test_mission_diagnostics_git_warnings \
            agent.tests.test_runtime_execution_observability \
            agent.tests.test_runtime_router_failover \
            agent.tests.test_runtime_consolidation_controller \
            agent.tests.test_openclaw_worker_compat \
            agent.tests.test_openhands_managed_home \
            agent.tests.test_openhands_timeout_cleanup \
            agent.tests.test_read_only_mission_completion \
            agent.tests.test_mcp_read_only_classifier \
            agent.tests.test_manual_review_status \
            -v
