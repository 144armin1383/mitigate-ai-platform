name: Autonomous Operator Runtime CI

on:
  push:
    branches: [main]
    paths:
      - 'agent/execution/**'
      - 'agent/runtime/**'
      - 'agent/bootstrap/**'
      - 'agent/maintenance/activate_isolated_mission_runtime.sh'
      - 'agent/tests/test_isolated_mission_runtime.py'
      - 'agent/tests/test_autonomous_operator_runtime.py'
      - 'agent/tests/test_runtime_consolidation_controller.py'
      - '.github/workflows/autonomous-operator-ci.yml'
  pull_request:
    paths:
      - 'agent/execution/**'
      - 'agent/runtime/**'
      - 'agent/bootstrap/**'
      - 'agent/maintenance/activate_isolated_mission_runtime.sh'
      - 'agent/tests/test_isolated_mission_runtime.py'
      - 'agent/tests/test_autonomous_operator_runtime.py'
      - 'agent/tests/test_runtime_consolidation_controller.py'
      - '.github/workflows/autonomous-operator-ci.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mcp>=2,<3'
      - name: Compile autonomous runtime
        run: |
          python -m py_compile \
            agent/execution/external_openhands_runner.py \
            agent/execution/managed_openhands_adapter.py \
            agent/runtime/autonomous_mission_queue.py \
            agent/runtime/autonomous_mission_diagnostics.py \
            agent/runtime/task_scope_workspace_controller.py \
            agent/runtime/managed_workspace_mission_controller.py \
            agent/runtime/production_runtime_api_isolated.py \
            agent/runtime/runtime_consolidation_controller.py \
            agent/runtime/runtime_mcp_server_extended.py \
            agent/tests/test_isolated_mission_runtime.py \
            agent/tests/test_autonomous_operator_runtime.py \
            agent/tests/test_runtime_consolidation_controller.py
      - name: Check shell integration
        run: |
          bash -n agent/bootstrap/configure_openhands_mcp.sh
          bash -n agent/bootstrap/enable_runtime_consolidation.sh
          bash -n agent/bootstrap/disable_runtime_consolidation.sh
          bash -n agent/maintenance/activate_isolated_mission_runtime.sh
      - name: Run regression tests
        run: |
          python -m unittest \
            agent.tests.test_isolated_mission_runtime \
            agent.tests.test_autonomous_operator_runtime \
            agent.tests.test_runtime_consolidation_controller \
            -v
