name: External Runtime Security Audit

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'agent/config/external-runtimes.json'
      - 'agent/bootstrap/install_external_runtimes.sh'
      - '.github/workflows/external-runtime-security-audit.yml'
  pull_request:
    paths:
      - 'agent/config/external-runtimes.json'
      - 'agent/bootstrap/install_external_runtimes.sh'
      - '.github/workflows/external-runtime-security-audit.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit-external-runtime-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read tested pins
        id: pins
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('agent/config/external-runtimes.json').read_text())
          pins = {c['name']: c['pinned_version'] for c in data['components']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for name in ('openhands', 'openclaw', 'ruflo'):
                  f.write(f'{name}={pins[name]}\n')
          PY

      - name: Audit exact npm pins separately without lifecycle scripts
        env:
          OPENCLAW: ${{ steps.pins.outputs.openclaw }}
          RUFLO: ${{ steps.pins.outputs.ruflo }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mitigate-runtime-audit
          audit_one() {
            NAME="$1"
            SPEC="$2"
            DIR="/tmp/mitigate-runtime-audit/$NAME"
            mkdir -p "$DIR"
            cd "$DIR"
            npm init -y >/dev/null 2>&1
            npm install --package-lock-only --ignore-scripts --no-fund --no-audit "$SPEC" >/dev/null
            npm audit --json > "/tmp/mitigate-runtime-audit/${NAME}-audit.json" || true
          }
          audit_one openclaw "openclaw@$OPENCLAW"
          audit_one ruflo "ruflo@$RUFLO"

      - name: Audit exact OpenHands pin
        env:
          OPENHANDS: ${{ steps.pins.outputs.openhands }}
        run: |
          python -m pip install --quiet pip-audit
          printf 'openhands-sdk==%s\nopenhands-tools==%s\n' "$OPENHANDS" "$OPENHANDS" \
            > /tmp/mitigate-runtime-audit/requirements.txt
          pip-audit -r /tmp/mitigate-runtime-audit/requirements.txt --format json \
            > /tmp/mitigate-runtime-audit/pip-audit.json || true

      - name: Build attributed security report
        id: report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def npm_counts(name):
              payload = json.loads(Path(f'/tmp/mitigate-runtime-audit/{name}-audit.json').read_text() or '{}')
              raw = payload.get('metadata', {}).get('vulnerabilities', {}) or {}
              return {key: int(raw.get(key, 0) or 0) for key in ('critical','high','moderate','low','total')}

          openclaw = npm_counts('openclaw')
          ruflo = npm_counts('ruflo')

          try:
              pip = json.loads(Path('/tmp/mitigate-runtime-audit/pip-audit.json').read_text() or '[]')
          except Exception:
              pip = []
          dependencies = pip.get('dependencies', []) if isinstance(pip, dict) else (pip if isinstance(pip, list) else [])
          pip_findings = sum(len(dep.get('vulns', []) or []) for dep in dependencies if isinstance(dep, dict))

          needs_review = any(
              counts['critical'] > 0 or counts['high'] > 0
              for counts in (openclaw, ruflo)
          ) or pip_findings > 0

          def row(name, counts):
              return f"| {name} | {counts['total']} | {counts['critical']} | {counts['high']} | {counts['moderate']} | {counts['low']} |"

          lines = [
              '# MITIGATE external runtime security audit', '',
              'Non-destructive audit of exact tested pins. No dependency is auto-upgraded.', '',
              '| Runtime | Total | Critical | High | Moderate | Low |',
              '|---|---:|---:|---:|---:|---:|',
              row('OpenClaw', openclaw),
              row('Ruflo', ruflo),
              f"| OpenHands/Python | {pip_findings} | n/a | n/a | n/a | n/a |", '',
              f'- Commit: `{os.environ.get("GITHUB_SHA", "unknown")}`',
              '- Ruflo remains benchmark-only regardless of audit result.',
              '- Never run `npm audit fix --force` against production runtimes.',
              '- Any remediation must pass disposable compatibility tests and the normal MITIGATE approval/rollback path.',
          ]
          Path('/tmp/mitigate-runtime-audit/report.md').write_text('\n'.join(lines) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'needs_review={str(needs_review).lower()}\n')
          PY

      - name: Publish summary
        run: |
          cat /tmp/mitigate-runtime-audit/report.md
          cat /tmp/mitigate-runtime-audit/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or refresh security review issue
        if: steps.report.outputs.needs_review == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="External runtime security audit requires review"
          NUMBER="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq '.[] | select(.title == "External runtime security audit requires review") | .number' | head -n 1)"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file /tmp/mitigate-runtime-audit/report.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/mitigate-runtime-audit/report.md
          fi
