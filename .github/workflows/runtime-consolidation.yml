name: Runtime Consolidation CI

on:
  push:
    branches:
      - integration/runtime-consolidation
  pull_request:
    paths:
      - 'agent/execution/runtime_adapter.py'
      - 'agent/execution/openhands_adapter.py'
      - 'agent/execution/openhands_subprocess_runner.py'
      - 'agent/execution/openclaw_adapter.py'
      - 'agent/execution/ruflo_adapter.py'
      - 'agent/execution/runtime_router.py'
      - 'agent/execution/runtime_branch_publisher.py'
      - 'agent/execution/workspace_manager.py'
      - 'agent/execution/upstream_manager.py'
      - 'agent/runtime/runtime_consolidation_controller.py'
      - 'agent/config/external-runtimes.json'
      - 'agent/bootstrap/install_external_runtimes.sh'
      - 'agent/tests/test_runtime_adapter.py'
      - 'agent/tests/test_openhands_adapter.py'
      - 'agent/tests/test_runtime_router.py'
      - 'agent/tests/test_runtime_branch_publisher.py'
      - 'agent/tests/test_runtime_consolidation_controller.py'
      - 'agent/tests/test_external_runtime_adapters.py'
      - 'agent/tests/test_upstream_manager.py'
      - '.github/workflows/runtime-consolidation.yml'

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile runtime modules
        run: |
          python -m py_compile \
            agent/execution/runtime_adapter.py \
            agent/execution/openhands_adapter.py \
            agent/execution/openhands_subprocess_runner.py \
            agent/execution/openclaw_adapter.py \
            agent/execution/ruflo_adapter.py \
            agent/execution/runtime_router.py \
            agent/execution/runtime_branch_publisher.py \
            agent/execution/workspace_manager.py \
            agent/execution/upstream_manager.py \
            agent/runtime/runtime_consolidation_controller.py \
            agent/tests/test_runtime_adapter.py \
            agent/tests/test_openhands_adapter.py \
            agent/tests/test_runtime_router.py \
            agent/tests/test_runtime_branch_publisher.py \
            agent/tests/test_runtime_consolidation_controller.py \
            agent/tests/test_external_runtime_adapters.py \
            agent/tests/test_upstream_manager.py

      - name: Validate external runtime manifest
        run: |
          python -m json.tool agent/config/external-runtimes.json >/dev/null
          bash -n agent/bootstrap/install_external_runtimes.sh

      - name: Run runtime tests
        run: |
          python -m unittest \
            agent.tests.test_runtime_adapter \
            agent.tests.test_openhands_adapter \
            agent.tests.test_runtime_router \
            agent.tests.test_runtime_branch_publisher \
            agent.tests.test_runtime_consolidation_controller \
            agent.tests.test_external_runtime_adapters \
            agent.tests.test_upstream_manager \
            -v
