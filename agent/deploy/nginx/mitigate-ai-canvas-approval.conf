# MITIGATE_CANVAS_APPROVAL_INTEGRATION
# Managed by agent/bootstrap/install_canvas_approval_integration.sh.
# These locations are host/domain agnostic and keep the panel bound to loopback.

location = /mitigate-approval-overlay.js {
    alias /usr/local/share/mitigate-ai/mitigate-approval-overlay.js;
    default_type application/javascript;
    add_header Cache-Control "no-store";
}

location ^~ /mitigate-runtime/api/ {
    include /etc/nginx/snippets/mitigate-ai-panel-auth.conf;

    rewrite ^/mitigate-runtime/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;

    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
}
