services:
  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:${MITIGATE_AGENT_CANVAS_VERSION:-1.13.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MITIGATE_AGENT_CANVAS_PORT:-8000}:8000"
    environment:
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:?LOCAL_BACKEND_API_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    volumes:
      - ${MITIGATE_OPENHANDS_STATE_PATH:-/srv/mitigate/data/openhands}:/home/openhands/.openhands
      - ${MITIGATE_PROJECTS_PATH:-/srv/mitigate}:/projects
    security_opt:
      - no-new-privileges:true
